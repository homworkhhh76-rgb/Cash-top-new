<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>كاش توب | نظام الصرافة والتحويلات</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    :root{
      --bg:#07182f;
      --bg2:#0b2445;
      --panel:#ffffff;
      --panel2:#f6f8fc;
      --text:#0b1f36;
      --muted:#6d7890;
      --line:#e7ebf2;
      --nav:#061a35;
      --nav2:#08264d;
      --gold:#d6a336;
      --gold2:#f1c45d;
      --green:#22a447;
      --red:#e63737;
      --blue:#0b66d8;
      --orange:#ff8a00;
      --purple:#7038c6;
      --shadow:0 18px 45px rgba(3, 20, 43, .12);
      --shadow2:0 8px 24px rgba(3, 20, 43, .10);
      --radius:22px;
      --sidebar:292px;
    }
    *{box-sizing:border-box}
    html{scroll-behavior:smooth}
    body{
      margin:0;
      min-height:100vh;
      font-family:'Cairo',system-ui,-apple-system,Segoe UI,Tahoma,Arial,sans-serif;
      background:
        radial-gradient(circle at top right, rgba(214,163,54,.18), transparent 26rem),
        linear-gradient(145deg,#07182f 0%,#0c2342 40%,#06162d 100%);
      color:var(--text);
      overflow-x:hidden;
    }
    button,input,select,textarea{font-family:inherit}
    button{cursor:pointer;border:0}
    a{color:inherit;text-decoration:none}
    .app-shell{display:flex;min-height:100vh;}
    .sidebar{
      width:var(--sidebar);
      position:fixed;
      inset-block:0;
      inset-inline-end:0;
      background:linear-gradient(180deg,var(--nav),var(--nav2));
      color:#fff;
      box-shadow:-18px 0 45px rgba(0,0,0,.22);
      z-index:50;
      display:flex;
      flex-direction:column;
      border-inline-start:1px solid rgba(255,255,255,.08);
    }
    .side-head{padding:24px 22px 18px;border-bottom:1px solid rgba(255,255,255,.09)}
    .brand{display:flex;align-items:center;gap:14px}
    .brand-logo{
      width:64px;height:64px;border-radius:22px;
      background:linear-gradient(145deg,rgba(241,196,93,.95),rgba(157,111,16,.9));
      display:grid;place-items:center;
      color:#07182f;font-weight:900;font-size:24px;
      box-shadow:inset 0 0 0 2px rgba(255,255,255,.22),0 14px 24px rgba(0,0,0,.18);
      overflow:hidden;
    }
    .brand-logo img{width:100%;height:100%;object-fit:cover}
    .brand h1{margin:0;font-size:22px;line-height:1.1;font-weight:900;letter-spacing:-.5px}
    .brand p{margin:5px 0 0;color:rgba(255,255,255,.68);font-size:12px;line-height:1.5}
    .side-meta{display:grid;gap:8px;margin-top:18px;font-size:12px;color:rgba(255,255,255,.72)}
    .side-meta span{display:flex;align-items:center;gap:8px}
    .side-nav{padding:14px 12px;overflow:auto;flex:1}
    .nav-item{
      width:100%;display:flex;align-items:center;gap:12px;
      padding:13px 14px;margin:5px 0;border-radius:16px;color:rgba(255,255,255,.78);
      background:transparent;text-align:right;font-size:15px;font-weight:800;transition:.18s ease;
    }
    .nav-item .ico{width:34px;height:34px;display:grid;place-items:center;border-radius:12px;background:rgba(255,255,255,.08);font-size:18px}
    .nav-item:hover{background:rgba(255,255,255,.08);color:#fff;transform:translateX(-3px)}
    .nav-item.active{background:linear-gradient(135deg,rgba(214,163,54,.98),rgba(177,125,22,.98));color:#061a35;box-shadow:0 12px 24px rgba(214,163,54,.16)}
    .nav-item.active .ico{background:rgba(255,255,255,.32)}
    .side-foot{padding:14px 18px 22px;border-top:1px solid rgba(255,255,255,.09);display:flex;gap:10px}
    .tiny-btn{height:42px;padding:0 14px;border-radius:14px;background:rgba(255,255,255,.09);color:#fff;font-weight:800;display:flex;align-items:center;gap:7px;justify-content:center}
    .tiny-btn.gold{background:linear-gradient(135deg,var(--gold),var(--gold2));color:#061a35;flex:1}

    .main{width:100%;padding-inline-end:var(--sidebar);min-height:100vh;}
    .topbar{
      position:sticky;top:0;z-index:30;
      padding:18px 22px;
      background:rgba(7,24,47,.84);
      backdrop-filter:blur(16px);
      border-bottom:1px solid rgba(255,255,255,.08);
      color:#fff;
    }
    .topbar-inner{display:flex;align-items:center;justify-content:space-between;gap:18px;max-width:1540px;margin:auto}
    .page-title h2{margin:0;font-size:25px;font-weight:900;letter-spacing:-.7px}
    .page-title p{margin:5px 0 0;color:rgba(255,255,255,.65);font-size:13px}
    .top-actions{display:flex;align-items:center;gap:10px;flex-wrap:wrap;justify-content:flex-end}
    .search-box{height:46px;width:min(360px,42vw);display:flex;align-items:center;gap:8px;background:rgba(255,255,255,.09);border:1px solid rgba(255,255,255,.09);border-radius:16px;padding:0 13px;color:#fff}
    .search-box input{background:transparent;border:0;outline:0;color:#fff;width:100%;font-size:14px}.search-box input::placeholder{color:rgba(255,255,255,.52)}
    .status-pill{height:46px;display:flex;align-items:center;gap:8px;border-radius:16px;padding:0 14px;background:rgba(255,255,255,.09);font-weight:800;font-size:13px;border:1px solid rgba(255,255,255,.08)}
    .dot{width:10px;height:10px;border-radius:50%;background:var(--green);box-shadow:0 0 0 5px rgba(34,164,71,.14)}
    .dot.off{background:var(--red);box-shadow:0 0 0 5px rgba(230,55,55,.14)}
    .menu-toggle{display:none;width:46px;height:46px;border-radius:16px;background:rgba(255,255,255,.1);color:#fff;font-size:21px}

    .content{padding:22px;max-width:1540px;margin:auto}
    .grid{display:grid;gap:16px}.grid.cards{grid-template-columns:repeat(4,minmax(190px,1fr))}.grid.two{grid-template-columns:1.2fr .8fr}.grid.three{grid-template-columns:repeat(3,1fr)}
    .card{
      background:var(--panel);border:1px solid rgba(255,255,255,.6);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden;
    }
    .card.pad{padding:18px}.card-head{padding:17px 18px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:12px;background:linear-gradient(180deg,#fff,#fbfcff)}
    .card-head h3{margin:0;font-size:18px;font-weight:900;letter-spacing:-.3px}.card-head small{color:var(--muted);font-weight:700}
    .stat{position:relative;padding:18px;display:flex;align-items:center;gap:14px;min-height:120px;overflow:hidden}.stat:after{content:"";position:absolute;inset-inline-start:-40px;inset-block-start:-40px;width:118px;height:118px;border-radius:50%;background:rgba(214,163,54,.08)}
    .stat-icon{width:58px;height:58px;border-radius:20px;display:grid;place-items:center;color:#fff;font-size:25px;box-shadow:var(--shadow2);flex:0 0 58px}.stat-icon.green{background:linear-gradient(135deg,#1f9f45,#22c55e)}.stat-icon.blue{background:linear-gradient(135deg,#0b66d8,#13a8ff)}.stat-icon.orange{background:linear-gradient(135deg,#ff8a00,#ffb84d)}.stat-icon.purple{background:linear-gradient(135deg,#7038c6,#9b6eff)}.stat-icon.red{background:linear-gradient(135deg,#e63737,#ff7070)}.stat-icon.gold{background:linear-gradient(135deg,#b88019,#f1c45d);color:#061a35}
    .stat-label{color:var(--muted);font-size:13px;font-weight:800}.stat-value{font-size:24px;font-weight:900;margin-top:2px;letter-spacing:-.5px}.stat-sub{font-size:12px;color:var(--muted);font-weight:700;margin-top:2px}
    .hero{
      border-radius:26px;background:linear-gradient(135deg,rgba(214,163,54,.96),rgba(241,196,93,.78));padding:22px;color:#061a35;box-shadow:var(--shadow);display:flex;align-items:center;justify-content:space-between;gap:16px;overflow:hidden;position:relative
    }
    .hero:before{content:"";position:absolute;inset-inline-start:-60px;top:-80px;width:230px;height:230px;border-radius:50%;background:rgba(255,255,255,.22)}
    .hero h2{margin:0;font-size:28px;font-weight:900}.hero p{margin:7px 0 0;font-weight:800;color:rgba(6,26,53,.72)}
    .quick-actions{display:flex;gap:10px;flex-wrap:wrap;position:relative;z-index:1}.btn{height:46px;border-radius:15px;padding:0 17px;display:inline-flex;align-items:center;justify-content:center;gap:8px;font-weight:900;font-size:14px;transition:.15s ease;white-space:nowrap}.btn:hover{transform:translateY(-2px)}.btn.primary{background:linear-gradient(135deg,#06356d,#0b66d8);color:#fff}.btn.gold{background:linear-gradient(135deg,var(--gold),var(--gold2));color:#061a35}.btn.green{background:linear-gradient(135deg,#168137,#23b550);color:#fff}.btn.red{background:linear-gradient(135deg,#ca2424,#f04a4a);color:#fff}.btn.gray{background:#eef2f8;color:#263750}.btn.dark{background:#07182f;color:#fff}.btn.ghost{background:transparent;color:var(--blue);border:1px solid #d8e5f6}.btn.sm{height:36px;border-radius:12px;padding:0 12px;font-size:12px}.btn.block{width:100%}
    .form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.form-grid.three{grid-template-columns:repeat(3,minmax(0,1fr))}.field{display:grid;gap:7px}.field.full{grid-column:1/-1}.field label{font-size:13px;font-weight:900;color:#263750}.field input,.field select,.field textarea{height:48px;border:1px solid #dfe6f1;background:#fff;border-radius:15px;padding:0 13px;outline:0;font-size:14px;color:#13253d;transition:.15s}.field textarea{height:86px;padding:12px;resize:vertical}.field input:focus,.field select:focus,.field textarea:focus{border-color:#91bdf4;box-shadow:0 0 0 4px rgba(11,102,216,.10)}.field input[readonly]{background:#f1f4f9;color:#717b8e}.hint{font-size:12px;color:var(--muted);font-weight:700;line-height:1.8}.calc-box{border:1px dashed #bed3ed;background:#f4f8ff;border-radius:18px;padding:14px;display:grid;gap:8px}.calc-row{display:flex;justify-content:space-between;gap:10px;font-size:13px;font-weight:900;color:#263750}.calc-row strong{font-size:17px;color:#061a35}
    table{width:100%;border-collapse:collapse}th,td{padding:12px 10px;border-bottom:1px solid var(--line);font-size:13px;text-align:right;vertical-align:middle}th{color:#516078;background:#f7f9fd;font-weight:900;position:sticky;top:0}td{font-weight:700}.table-wrap{overflow:auto;max-height:560px}.badge{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:5px 9px;font-size:12px;font-weight:900}.badge.green{background:#e9f8ee;color:#147a31}.badge.red{background:#ffebeb;color:#b51e1e}.badge.blue{background:#eaf3ff;color:#075dbf}.badge.gold{background:#fff4d7;color:#8a5a00}.badge.gray{background:#eff3f8;color:#5e6b7d}.badge.purple{background:#f1eaff;color:#6124bd}.badge.orange{background:#fff0df;color:#c46100}
    .empty{padding:34px;text-align:center;color:var(--muted);font-weight:800}.toolbar{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:14px}.toolbar .filters{display:flex;gap:10px;flex-wrap:wrap}.mini-input{height:40px;border:1px solid #dfe6f1;border-radius:13px;padding:0 12px;outline:0;min-width:160px;background:#fff}.balance-grid{display:grid;grid-template-columns:repeat(5,minmax(150px,1fr));gap:12px}.balance-card{background:linear-gradient(180deg,#fff,#f7faff);border:1px solid #edf1f6;border-radius:19px;padding:15px;box-shadow:0 8px 20px rgba(7,24,47,.06)}.balance-card .code{font-size:18px;font-weight:900;color:#07182f}.balance-card .name{font-size:12px;color:var(--muted);font-weight:800;margin:2px 0 8px}.balance-card .amount{font-size:22px;font-weight:900}.balance-card .rate{font-size:12px;color:#6c7890;font-weight:800;margin-top:5px}
    .tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}.tab{height:40px;border-radius:13px;padding:0 14px;background:#eef3fa;color:#33445c;font-weight:900}.tab.active{background:#07182f;color:#fff}
    .receipt-modal,.drawer-overlay{position:fixed;inset:0;background:rgba(1,8,20,.55);z-index:100;display:none;align-items:center;justify-content:center;padding:18px}.receipt-modal.show,.drawer-overlay.show{display:flex}.modal-card{width:min(760px,100%);max-height:92vh;overflow:auto;background:#fff;border-radius:26px;box-shadow:0 30px 80px rgba(0,0,0,.34)}.modal-head{padding:16px 18px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between}.modal-head h3{margin:0;font-size:18px;font-weight:900}.receipt{margin:18px;border:1px solid #e4e9f2;border-radius:22px;padding:22px;background:#fff}.receipt-brand{display:flex;align-items:center;justify-content:space-between;gap:16px;border-bottom:2px dashed #d8dfeb;padding-bottom:16px;margin-bottom:16px}.receipt-brand h2{margin:0;font-size:26px;font-weight:900;color:#07182f}.receipt-brand p{margin:4px 0 0;font-size:13px;color:var(--muted);font-weight:800}.receipt-table{display:grid;grid-template-columns:1fr 1fr;gap:10px}.receipt-line{background:#f7f9fd;border:1px solid #edf1f6;border-radius:14px;padding:10px}.receipt-line span{display:block;font-size:12px;color:#6c7890;font-weight:800}.receipt-line strong{display:block;margin-top:3px;font-size:15px}.toast{position:fixed;inset-block-start:18px;inset-inline-start:18px;z-index:200;display:grid;gap:8px}.toast-item{min-width:260px;max-width:360px;background:#fff;border-inline-start:5px solid var(--green);border-radius:16px;padding:12px 14px;box-shadow:var(--shadow);font-weight:900;color:#15243c}.toast-item.error{border-color:var(--red)}.toast-item.warn{border-color:var(--gold)}
    .mobile-nav{display:none}.mobile-quick{display:none}.print-only{display:none}
    .risk-note{border:1px solid #ffe0a4;background:#fff8e7;color:#6f4700;border-radius:18px;padding:14px;font-weight:800;font-size:13px;line-height:1.9}.mono{direction:ltr;text-align:left;font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace}.danger-zone{border:1px solid #ffd0d0;background:#fff7f7;border-radius:18px;padding:14px}
    @media (max-width:1180px){.grid.cards{grid-template-columns:repeat(2,1fr)}.grid.two,.grid.three{grid-template-columns:1fr}.balance-grid{grid-template-columns:repeat(3,1fr)}}
    @media (max-width:820px){
      html,body{width:100%;max-width:100%;overflow-x:hidden}
      :root{--sidebar:min(86vw,320px);--radius:20px}
      body.drawer-open{overflow:hidden}
      .sidebar{width:var(--sidebar);max-width:86vw;inset-inline-end:0;inset-inline-start:auto;right:0;left:auto;transform:translateX(calc(100% + 44px));transition:transform .26s cubic-bezier(.2,.8,.2,1),visibility 0s linear .26s;z-index:150;border-radius:26px 0 0 26px;box-shadow:none;visibility:hidden;pointer-events:none;will-change:transform}
      .sidebar.open{transform:translateX(0);visibility:visible;pointer-events:auto;box-shadow:-28px 0 80px rgba(0,0,0,.38);transition:transform .26s cubic-bezier(.2,.8,.2,1),visibility 0s}
      .side-head{padding:20px 18px 14px}.brand-logo{width:54px;height:54px;border-radius:18px}.brand h1{font-size:19px}.side-nav{padding-bottom:100px}.nav-item{padding:12px 13px;border-radius:15px}
      .drawer-overlay{z-index:110;padding:0;background:rgba(1,8,20,.58);backdrop-filter:blur(2px);align-items:stretch;justify-content:flex-end}
      .drawer-overlay.show{display:block}
      .main{padding-inline-end:0!important;padding-bottom:92px;width:100%;max-width:100vw;overflow:hidden}
      .menu-toggle{display:grid;place-items:center;flex:0 0 44px}
      .topbar{padding:12px 10px}.topbar-inner{align-items:flex-start;gap:10px;flex-wrap:wrap}.page-title{flex:1;min-width:0}.page-title h2{font-size:21px}.page-title p{font-size:12px;line-height:1.7}.top-actions{width:100%;gap:7px;justify-content:space-between}.search-box{width:100%;order:4;height:44px}.status-pill{height:42px;font-size:12px}.top-actions .btn.gold{height:42px;padding:0 13px}
      .content{padding:12px 10px 108px}.grid.cards{grid-template-columns:1fr}.grid.two,.grid.three,.form-grid,.form-grid.three{grid-template-columns:1fr}.hero{display:grid;padding:18px;border-radius:23px}.hero h2{font-size:21px}.quick-actions{display:grid;grid-template-columns:1fr 1fr;width:100%}.quick-actions .btn{width:100%;padding:0 10px}.balance-grid{grid-template-columns:1fr}.card{border-radius:21px}.card-head{padding:14px;align-items:flex-start}.card-head h3{font-size:16px}.table-wrap{max-height:none;overflow:auto}table{min-width:780px}th,td{padding:10px 8px;white-space:nowrap}
      .mobile-nav{position:fixed;left:10px;right:10px;bottom:10px;height:66px;background:rgba(6,26,53,.96);border:1px solid rgba(255,255,255,.08);box-shadow:0 18px 45px rgba(0,0,0,.26);border-radius:22px;z-index:80;display:flex;align-items:center;justify-content:space-around;backdrop-filter:blur(14px)}
      .mobile-nav button{background:transparent;color:rgba(255,255,255,.66);font-size:11px;font-weight:900;display:grid;gap:2px;place-items:center;min-width:54px}.mobile-nav button span{font-size:20px}.mobile-nav button.active{color:var(--gold2)}
      .receipt-table{grid-template-columns:1fr}.receipt-modal{padding:10px}.receipt{margin:12px;padding:16px}.receipt-brand{display:grid;text-align:right}.toast{inset-inline:12px;inset-block-start:12px}.toast-item{min-width:0;max-width:none}
      .mobile-quick{display:flex;position:fixed;right:18px;bottom:88px;z-index:90}.mobile-quick .btn{width:58px;height:58px;border-radius:21px;padding:0;font-size:32px;line-height:1;box-shadow:0 16px 28px rgba(0,0,0,.24)}
      .mobile-quick .btn:active,.mobile-nav button:active,.menu-toggle:active{transform:scale(.96)}
    }
    @media print{
      body{background:#fff}.sidebar,.topbar,.mobile-nav,.mobile-quick,.toast,.modal-head .btn,.no-print{display:none!important}.main{padding:0}.content{padding:0}.receipt-modal{display:block!important;position:static;background:#fff;padding:0}.modal-card{box-shadow:none;border-radius:0;max-height:none;width:100%}.receipt{border:0;margin:0}.app-shell>*:not(.main){display:none!important}#view{display:none!important}
    }

    /* إضافات: SVG icons + الوضع النهاري/الليلي */
    .svg-icon,.ui-ico svg{width:1.15em;height:1.15em;display:block;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
    .ui-ico{display:inline-flex;align-items:center;justify-content:center;line-height:0;vertical-align:middle;color:currentColor}
    .nav-item .ico svg,.mobile-nav svg{width:20px;height:20px}.stat-icon svg{width:27px;height:27px}.btn .ui-ico svg,.tiny-btn .ui-ico svg{width:18px;height:18px}.side-meta .ui-ico svg{width:15px;height:15px}.menu-toggle .ui-ico svg{width:22px;height:22px}.mobile-quick .ui-ico svg{width:30px;height:30px}
    .theme-night{--panel:#101c2e;--panel2:#0d1728;--text:#eaf2ff;--muted:#9fb0c7;--line:#22334d;--nav:#030b17;--nav2:#071425;--shadow:0 18px 45px rgba(0,0,0,.28);--shadow2:0 8px 24px rgba(0,0,0,.24)}
    body.theme-night{background:radial-gradient(circle at top right, rgba(214,163,54,.10), transparent 26rem),linear-gradient(145deg,#030914 0%,#071325 45%,#020712 100%);color:var(--text)}
    body.theme-night .card,body.theme-night .modal-card,body.theme-night .receipt,body.theme-night .toast-item{background:var(--panel);border-color:#22334d;color:var(--text)}
    body.theme-night .card-head{background:linear-gradient(180deg,#101c2e,#0d1728);border-color:#22334d}
    body.theme-night .field input,body.theme-night .field select,body.theme-night .field textarea,body.theme-night .mini-input{background:#0b1626;color:#eaf2ff;border-color:#273854}
    body.theme-night .field input[readonly]{background:#131f33;color:#b7c7dd}
    body.theme-night th{background:#111e31;color:#dbe7f7}body.theme-night td{border-color:#22334d}
    body.theme-night .balance-card{background:linear-gradient(180deg,#101c2e,#0c1728);border-color:#22334d}
    body.theme-night .balance-card .code,body.theme-night .balance-card .amount,body.theme-night .calc-row strong{color:#f5f8ff}
    body.theme-night .calc-box{background:#0b1729;border-color:#2e4669}body.theme-night .risk-note{background:#241d0e;border-color:#6d5217;color:#f3d78d}
    body.theme-night .btn.gray{background:#16243a;color:#eaf2ff}body.theme-night .btn.ghost{border-color:#28446b;color:#8cc1ff}
    body.theme-night .receipt-line{background:#0b1626;border-color:#22334d}body.theme-night .receipt-line strong,body.theme-night .receipt-brand h2{color:#f5f8ff}

    /* الوضع النهاري الأبيض الكامل */
    body:not(.theme-night){
      --bg:#f7f9fc;
      --bg2:#ffffff;
      --panel:#ffffff;
      --panel2:#f8fafd;
      --text:#0b1f36;
      --muted:#64748b;
      --line:#e5eaf2;
      --nav:#ffffff;
      --nav2:#ffffff;
      --shadow:0 14px 36px rgba(7,24,47,.08);
      --shadow2:0 8px 22px rgba(7,24,47,.07);
      background:#f6f8fb!important;
      color:var(--text)!important;
    }
    body:not(.theme-night) .app-shell,
    body:not(.theme-night) .main,
    body:not(.theme-night) .content{background:#f6f8fb;color:var(--text)}
    body:not(.theme-night) .sidebar{
      background:#ffffff!important;

  function loadState(){
    try{
      const raw = localStorage.getItem(KEY);

      const fresh = defaultState();
      data.settings = {...fresh.settings, ...(data.settings || {})};
      data.currencies = data.currencies?.length ? data.currencies : fresh.currencies;
      const existingCodes = new Set(data.currencies.map(c => c.code));
      fresh.currencies.forEach(c => { if(!existingCodes.has(c.code)) data.currencies.push(c); });
      data.currencies.sort((a,b)=>Number(b.primary)-Number(a.primary)||a.code.localeCompare(b.code));
      data.balances = {...Object.fromEntries(data.currencies.map(c => [c.code,0])), ...(data.balances || {})};
      ['customers','employees','operations','transfers','checks','ledger','audit'].forEach(k => data[k] = Array.isArray(data[k]) ? data[k] : []);
      if(!Array.isArray(data.accounts) || !data.accounts.length){
        data.accounts = [{id:'ACC-CASH', name:'صندوق الكاش', type:'cash', active:true, balances:{...data.balances}, rates:{}, createdAt:nowISO()}];
      }
      data.accounts.forEach(acc => {
        acc.active = acc.active !== false;
        acc.balances = {...Object.fromEntries(data.currencies.map(c => [c.code,0])), ...(acc.balances || {})};
        acc.rates = acc.rates || {};
        if(!Array.isArray(acc.allowedCurrencies) || !acc.allowedCurrencies.length) acc.allowedCurrencies = data.currencies.filter(c => c.primary).map(c => c.code);

      data.activeAccountId = data.activeAccountId || 'ACC-CASH';
      data.counters = {...fresh.counters, ...(data.counters || {})};
      data.counters.account = data.counters.account || data.accounts.length;

  function rateToBase(code, accountId=''){

  function toBase(amount, code, accountId=''){ return round(Number(amount || 0) * rateToBase(code, accountId) / 100, 4); }
  function fromBase(amount, code, accountId=''){ return rateToBase(code, accountId) ? round(Number(amount || 0) / (rateToBase(code, accountId) / 100), 4) : 0; }
  function crossRate(from, to, accountId=''){ return rateToBase(to, accountId) ? round((rateToBase(from, accountId) / rateToBase(to, accountId)) * 100, 4) : 0; }

  function validateBalance(accountId, code, delta){
    const acc = accountById(accountId);
    const before = Number(acc?.balances?.[code] || 0);
    if(delta < 0 && before + delta < -0.0001){
      const err = new Error(`الرصيد غير كافٍ في ${accountName(accountId)} / ${code}. الرصيد الحالي ${money(before)} والمطلوب ${money(Math.abs(delta))}`);
      err.insufficient = {accountId:acc?.id || accountId, code, balance:before, required:Math.abs(delta), shortage:round(Math.abs(delta)-before,4)};
      throw err;
    }
  }
  function applyMovements(moves, meta={}){
    const aggregate = {};
    moves.filter(m => Number(m.delta)).forEach(m => {
      const accountId = m.accountId || meta.accountId || state.activeAccountId || 'ACC-CASH';
      const key = `${accountId}__${m.code}`;
      aggregate[key] = {accountId, code:m.code, delta:round((aggregate[key]?.delta || 0) + Number(m.delta),4)};
    });
    Object.values(aggregate).forEach(x => validateBalance(x.accountId, x.code, x.delta));
    const applied = [];
    moves.filter(m => Number(m.delta)).forEach(m => {
      const accountId = m.accountId || meta.accountId || state.activeAccountId || 'ACC-CASH';
      const acc = accountById(accountId);
      if(!acc) throw new Error('الحساب المحدد غير موجود');
      acc.balances = {...Object.fromEntries(state.currencies.map(c => [c.code,0])), ...(acc.balances || {})};
      const before = Number(acc.balances[m.code] || 0);
      const after = round(before + Number(m.delta), 4);
      acc.balances[m.code] = after;
      const row = {id:uid('cash'), at:nowISO(), accountId:acc.id, accountName:acc.name, code:m.code, delta:round(m.delta,4), before, after, type:m.delta >= 0 ? 'وارد':'صادر', reason:m.reason || meta.reason || '', ref:meta.ref || '', employee:currentEmployee().name, note:meta.note || ''};
      state.ledger.unshift(row); applied.push(row);
    });
    syncCashBalances();
    return applied;
  }

            <div class="field"><label>سعر التحويل لكل 100</label><input name="rate" id="rescueRate" type="number" step="0.0001"></div>

          </form>
        </div>
      </div>`;
    document.body.appendChild(modal);
    function refreshSourceCurrencies(){
      const sourceAccount = $('#rescueSourceAccount', modal).value;
      $('#rescueSourceCode', modal).innerHTML = rescueCurrencyOptions(sourceAccount);
      const preferred = state.currencies.find(c => accountBalance(sourceAccount, c.code) > 0)?.code || info.code;
      $('#rescueSourceCode', modal).value = preferred;
      calc();
    }
    function calc(){
      const sourceAccount = $('#rescueSourceAccount', modal).value;
      const targetAccount = $('#rescueTargetAccount', modal).value;
      const sourceCode = $('#rescueSourceCode', modal).value;
      const targetCode = $('#rescueTargetCode', modal).value;
      const targetAmount = Number($('#rescueTargetAmount', modal).value || 0);
      const baseValue = toBase(targetAmount, targetCode, targetAccount);
      const sourceAmount = fromBase(baseValue, sourceCode, sourceAccount);
      $('#rescueRate', modal).value = sourceAmount ? round(targetAmount / sourceAmount * 100,4) : crossRate(sourceCode, targetCode, sourceAccount);
      $('#rescueSourceAmount', modal).value = money(sourceAmount,4);
    }
    modal.addEventListener('click', e => { if(e.target.matches('[data-close-rescue]') || e.target === modal) modal.remove(); });
    $('#rescueSourceAccount', modal).addEventListener('change', refreshSourceCurrencies);
    ['change','input'].forEach(ev => $('#rescueForm', modal).addEventListener(ev, e => { if(e.target.id !== 'rescueSourceAccount') calc(); }));
    $('#rescueForm', modal).onsubmit = e => {
      e.preventDefault();
      try{
        const d = Object.fromEntries(new FormData(e.target));
        const targetAmount = Number(d.targetAmount || 0);
        const sourceAmount = Number(String($('#rescueSourceAmount', modal).value).replace(/,/g,'') || 0);
        if(targetAmount <= 0 || sourceAmount <= 0) throw new Error('أدخل قيمة تحويل صحيحة');
        applyMovements([
          {accountId:d.sourceAccount, code:d.sourceCode, delta:-sourceAmount, reason:'تحويل لتغطية نقص رصيد'},
          {accountId:d.targetAccount, code:d.targetCode, delta:targetAmount, reason:'تغطية نقص رصيد'}
        ], {ref:'تغطية نقص', reason:'تحويل داخلي لتغطية نقص الرصيد'});
        audit('تغطية نقص رصيد', `${sourceAmount} ${d.sourceCode} من ${accountName(d.sourceAccount)} إلى ${targetAmount} ${d.targetCode} في ${accountName(d.targetAccount)}`);
        save(); modal.remove(); toast('تم تحويل الرصيد. أعد تنفيذ العملية الآن.');
        if(currentView === 'cashbox') renderCashbox();
      }catch(err){ if(!handleBalanceError(err)) toast(err.message, 'error'); }
    };
    refreshSourceCurrencies();
  }

    const openModal = id => { const el = document.getElementById(id); if(el){ el.classList.add('show'); document.body.classList.add('modal-open'); } };
    const closeModal = el => { const modal = el.closest('.modal-lite'); if(modal) modal.classList.remove('show'); if(!document.querySelector('.modal-lite.show')) document.body.classList.remove('modal-open'); };
    $$('[data-open-modal]').forEach(btn => btn.onclick = () => openModal(btn.dataset.openModal));
    $$('[data-close-modal]').forEach(btn => btn.onclick = () => closeModal(btn));
    $$('.modal-lite').forEach(m => m.addEventListener('click', e => { if(e.target === m){ m.classList.remove('show'); if(!document.querySelector('.modal-lite.show')) document.body.classList.remove('modal-open'); } }));

    $('#activeAccountSelect').onchange = e => { state.activeAccountId = e.target.value; save(); renderCashbox(); };
    $$('[data-account-chip]').forEach(b => b.onclick = () => { state.activeAccountId = b.dataset.accountChip; save(); renderCashbox(); });
    $$('[data-toggle-account]').forEach(b => b.onclick = () => {
      const acc = accountById(b.dataset.toggleAccount);
      if(!acc || acc.id === 'ACC-CASH') return;
      acc.active = acc.active === false ? true : false;
      audit(acc.active ? 'تفعيل حساب' : 'إيقاف حساب', acc.name);
      save(); renderCashbox();
    });

    $('#accountForm').onsubmit = e => {
      e.preventDefault(); const f = Object.fromEntries(new FormData(e.target));
      const id = uid('account').replace('ACCOUNT','ACC');
      const balances = Object.fromEntries(state.currencies.map(c => [c.code,0]));
      state.accounts.push({id, name:f.name.trim(), type:f.type, active:true, balances, rates:{}, allowedCurrencies:state.currencies.filter(c=>c.primary || c.code==='USDT').map(c=>c.code), createdAt:nowISO()});
      state.activeAccountId = id;
      audit('إضافة حساب', f.name); save(); toast('تمت إضافة الحساب'); renderCashbox();
    };
    $('#accountCurrencySelect').onchange = e => {
      $('#accountCurrencyGrid').innerHTML = currencyCheckboxes(e.target.value);
    };
    $('#accountCurrenciesForm').onsubmit = e => {
      e.preventDefault();
      const fd = new FormData(e.target);
      const acc = accountById(fd.get('accountId'));
      if(!acc) return toast('الحساب غير موجود', 'error');
      const selected = fd.getAll('allowedCurrencies');
      if(!selected.length) return toast('اختر عملة واحدة على الأقل للحساب', 'warn');
      acc.allowedCurrencies = selected;
      audit('تحديد عملات حساب', `${acc.name}: ${selected.join(', ')}`);
      save(); toast('تم حفظ عملات الحساب'); renderCashbox();
    };

    $('#accountRateForm').onsubmit = e => {
      e.preventDefault(); const f = Object.fromEntries(new FormData(e.target));
      const acc = accountById(f.accountId); if(!acc) return toast('الحساب غير موجود', 'error');
      acc.rates = acc.rates || {};
      if(String(f.rate || '').trim() === '') delete acc.rates[f.code];
      else acc.rates[f.code] = Number(f.rate);
      audit('تعديل سعر صرف حساب', `${acc.name} / ${f.code} = ${f.rate || 'السعر العام'}`);
      save(); toast('تم حفظ سعر الصرف الخاص بالحساب'); renderCashbox();
    };

    $('#cashForm').onsubmit = e => {
      e.preventDefault(); const f = Object.fromEntries(new FormData(e.target));
      try{
        const delta = Number(f.amount) * (f.kind === 'out' ? -1 : 1);
        applyMovements([{accountId:f.accountId, code:f.code, delta, reason:f.note}], {ref:'حركة حساب', reason:f.note});
        audit('حركة حساب مباشرة', `${accountName(f.accountId)} - ${f.kind === 'out' ? 'صادر':'وارد'} ${f.amount} ${f.code} - ${f.note}`);
        save(); toast('تم حفظ حركة الحساب'); renderCashbox();
      }catch(err){ if(!handleBalanceError(err)) toast(err.message, 'error'); }
    };

    $('#cashAccountSelect')?.addEventListener('change', e => {
      $('#cashCurrencySelect').innerHTML = currencyOptions('', true, e.target.value);
    });
    $('#openingAccountSelect')?.addEventListener('change', e => {
      $('#openingCurrencySelect').innerHTML = currencyOptions('', true, e.target.value);
    });

    $('#openingBalanceForm').onsubmit = e => {
      e.preventDefault(); const f = Object.fromEntries(new FormData(e.target));
      try{
        const current = accountBalance(f.accountId, f.code);
        const target = Number(f.amount || 0);
        const delta = round(target - current,4);
        applyMovements([{accountId:f.accountId, code:f.code, delta, reason:f.note || 'رصيد افتتاحي'}], {ref:'رصيد افتتاحي', reason:f.note || 'رصيد افتتاحي'});
        audit('تطبيق رصيد افتتاحي', `${accountName(f.accountId)} ${f.code}: ${current} -> ${target}`);
        save(); toast('تم تطبيق الرصيد الافتتاحي'); renderCashbox();

  async function updateGlobalRates(codes = state.currencies.map(c=>c.code), silent = false){
    const base = state.settings.baseCurrency || 'ILS';
    try{
      if(!silent) toast('جاري جلب الأسعار العالمية للاطلاع...');
      const res = await fetch(`https://open.er-api.com/v6/latest/${encodeURIComponent(base)}`);
      if(!res.ok) throw new Error('تعذر الاتصال بمصدر الأسعار');
      const data = await res.json();
      const rates = data.rates || data.conversion_rates || {};
      let count = 0;
      state.currencies.forEach(c => {
        if(!codes.includes(c.code)) return;
        if(c.code === base){ c.worldRate = 100; count++; return; }
        const apiCode = c.code === 'USDT' && !rates.USDT ? 'USD' : c.code;
        const v = Number(rates[apiCode]);
        if(v > 0){ c.worldRate = round(100 / v, 4); count++; }
      });
      state.settings.lastGlobalRatesAt = nowISO();
      audit('جلب أسعار عالمية للاطلاع', `تحديث ${count} عملة من ${base}`);
      save();
      if(!silent) toast(`تم تحديث الأسعار العالمية لـ ${count} عملة، دون تغيير الأسعار المحلية المعتمدة`);
      return count;
    }catch(err){ if(!silent) toast('فشل جلب الأسعار العالمية: ' + err.message, 'error'); return 0; }
  }
  async function fetchGlobalRatesAndApply(){
    const mode = $('#globalRateMode')?.value || 'all';
    const selected = Array.from($('#globalRateCodes')?.selectedOptions || []).map(o=>o.value);

    if(mode === 'selected' && !codes.length) return toast('اختر عملة واحدة على الأقل', 'warn');
    await updateGlobalRates(codes);
    renderRates();
  }

    f.onsubmit = e => {

  function receiveTransfer(id){
    const t = state.transfers.find(x=>x.id===id); if(!t) return;

    if(!confirm(`تأكيد استلام الحوالة رقم ${t.id} وخصم ${money(t.amountReceive,4)} ${t.receiveCurrency} من حساب ${accountName(t.accountId)}؟`)) return;
    try{
      const mv = {accountId:t.accountId || state.activeAccountId || 'ACC-CASH', code:t.receiveCurrency, delta:-Number(t.amountReceive || 0), reason:'استلام حوالة وخصم مبلغ التسليم من الحساب'};
      const applied = applyMovements([mv], {ref:t.id, reason:'استلام حوالة', note:t.notes});
      t.movements = [...(t.movements || []), mv];
      t.ledgerIds = [...(t.ledgerIds || []), ...applied.map(x=>x.id)];
      t.received = true; t.payoutApplied = true; t.status = 'مستلمة'; t.receivedAt = nowISO(); t.receivedBy = currentEmployee().name;
      t.receiveLedgerIds = applied.map(x=>x.id);
      audit('استلام حوالة وخصم مبلغ التسليم', id); save(); toast('تم استلام الحوالة وخصم مبلغ التسليم فقط، والعمولة بقيت محفوظة'); renderTransfers();
    }catch(err){ if(!handleBalanceError(err)) toast(err.message, 'error'); }

      const applied = applyMovements([mv], {ref:t.id, reason:'إلغاء استلام حوالة', note:t.notes});
      t.movements = [...(t.movements || []), mv];
      t.ledgerIds = [...(t.ledgerIds || []), ...applied.map(x=>x.id)];
      t.received = false; t.payoutApplied = false; t.status = 'بانتظار الاستلام'; t.receivedAt = ''; t.receivedBy = ''; t.undoReceiveAt = nowISO(); t.undoReceiveBy = currentEmployee().name;
      t.undoReceiveLedgerIds = applied.map(x=>x.id);
      audit('إلغاء استلام حوالة وعكس الخصم', id); save(); toast('تم إلغاء الاستلام وإرجاع مبلغ التسليم للحساب'); renderTransfers();

  function renderReports(){
    const mode = localStorage.getItem('reportMode') || 'daily';
    const storedStart = localStorage.getItem('reportStart');
    const storedEnd = localStorage.getItem('reportEnd');
    const d = new Date();
    const yyyy = d.getFullYear();
    const mm = String(d.getMonth()+1).padStart(2,'0');
    const todayStr = today();
    const monthStart = `${yyyy}-${mm}-01`;
    const yearStart = `${yyyy}-01-01`;
    const start = storedStart || (mode === 'yearly' ? yearStart : mode === 'monthly' ? monthStart : todayStr);
    const end = storedEnd || todayStr;
    const from = new Date(start + 'T00:00:00'); const to = new Date(end + 'T23:59:59');
    const inRange = x => { const raw = x.createdAt || x.at || x.receivedAt || x.cashedAt; const dd = new Date(raw); return dd >= from && dd <= to; };
    const ops = state.operations.filter(inRange), transfers = state.transfers.filter(inRange), checks = state.checks.filter(inRange), ledger = state.ledger.filter(inRange);
    const ok = x => !['محذوف','ملغية','مرفوضة'].includes(x.status);
    const incoming = ledger.filter(x=>x.delta>0).reduce((sum,x)=>sum+toBase(x.delta,x.code),0);
    const outgoing = ledger.filter(x=>x.delta<0).reduce((sum,x)=>sum+toBase(Math.abs(x.delta),x.code),0);
    const opProfit = ops.filter(ok).reduce((sum,x)=>sum+Number(x.profitBase||0),0);
    const transferProfit = transfers.filter(ok).reduce((sum,x)=>sum+Number(x.profitBase||0),0);
    const checkProfit = checks.filter(ok).reduce((sum,x)=>sum+Number(x.profitBase||0),0);
    const profit = opProfit + transferProfit + checkProfit;
    const byCurrency = state.currencies.map(c => {
      const rows = ledger.filter(x=>x.code===c.code);
      return {code:c.code, in:rows.filter(x=>x.delta>0).reduce((sum,x)=>sum+x.delta,0), out:rows.filter(x=>x.delta<0).reduce((sum,x)=>sum+Math.abs(x.delta),0), balance:state.balances[c.code]||0, value:toBase(state.balances[c.code]||0,c.code)};
    }).filter(x=>x.in || x.out || x.balance || x.value);
    const profitRows = [
      ['الصرافة', ops.length, opProfit], ['الحوالات', transfers.length, transferProfit], ['الشيكات', checks.length, checkProfit]
    ].map(x=>`<tr><td><b>${x[0]}</b></td><td>${x[1]}</td><td>${money(x[2])} ${state.settings.baseCurrency}</td></tr>`).join('');
    const ledgerRows = ledger.slice(0,120).map(x=>`<tr><td>${dt(x.at)}</td><td>${statusBadge(x.type)}</td><td>${money(Math.abs(x.delta),4)} ${x.code}</td><td>${money(x.before,4)} → ${money(x.after,4)}</td><td>${esc(x.reason)}</td><td>${esc(x.ref)}</td><td>${esc(x.employee)}</td></tr>`).join('') || emptyRow(7);
    const transferRows = transfers.slice(0,80).map(t=>`<tr><td>${dt(t.createdAt)}</td><td><b>${t.id}</b></td><td>${statusBadge(t.status)}</td><td>${esc(t.senderName)} ← ${esc(t.receiverName)}</td><td>${money(t.amountSent,4)} ${t.sendCurrency}</td><td>${money(t.amountReceive,4)} ${t.receiveCurrency}</td><td>${money(t.profitBase)} ${state.settings.baseCurrency}</td></tr>`).join('') || emptyRow(7);
    const checkRows = checks.slice(0,80).map(ch=>`<tr><td>${dt(ch.createdAt)}</td><td><b>${ch.id}</b></td><td>${esc(ch.direction)}</td><td>${esc(ch.beneficiary)}</td><td>${money(ch.amount,4)} ${ch.currency}</td><td>${statusBadge(ch.status)}</td><td>${money(ch.profitBase)} ${state.settings.baseCurrency}</td></tr>`).join('') || emptyRow(7);
    const auditRows = state.audit.filter(inRange).slice(0,80).map(a => `<tr><td>${dt(a.at)}</td><td>${esc(a.employee)}</td><td>${esc(a.action)}</td><td>${esc(a.details)}</td></tr>`).join('') || emptyRow(4);
    mount(`
      <div class="toolbar">
        <div class="filters">
          <button class="tab ${mode==='daily'?'active':''}" data-report-mode="daily">يومي</button>
          <button class="tab ${mode==='monthly'?'active':''}" data-report-mode="monthly">شهري</button>
          <button class="tab ${mode==='yearly'?'active':''}" data-report-mode="yearly">سنوي</button>
          <button class="tab ${mode==='custom'?'active':''}" data-report-mode="custom">من تاريخ إلى تاريخ</button>
          <input type="date" class="mini-input" id="rStart" value="${start}">
          <input type="date" class="mini-input" id="rEnd" value="${end}">
          <button class="btn primary sm" id="applyReport">تطبيق</button>
        </div>
        <button class="btn gray sm" id="exportReport">تصدير التقرير CSV</button>
      </div>
      <div class="grid cards" style="margin-bottom:16px">
        ${statCard('exchange','blue','عدد العمليات',ops.length + transfers.length + checks.length,'صرافة + حوالات + شيكات')}
        ${statCard('in','green','الوارد',`${money(incoming)} ${state.settings.baseCurrency}`,'ضمن الفترة المحددة')}
        ${statCard('out','red','الصادر',`${money(outgoing)} ${state.settings.baseCurrency}`,'ضمن الفترة المحددة')}
        ${statCard('profit','orange','صافي الأرباح',`${money(profit)} ${state.settings.baseCurrency}`,'فرق سعر + عمولات')}
      </div>
      <div class="grid two" style="margin-bottom:16px">
        <div class="card"><div class="card-head"><h3>حساب الأرباح حسب المصدر</h3><small>${start} ← ${end}</small></div><div class="table-wrap"><table><thead><tr><th>المصدر</th><th>عدد السجلات</th><th>الربح</th></tr></thead><tbody>${profitRows}</tbody></table></div></div>
        <div class="card"><div class="card-head"><h3>تقرير كل عملة</h3></div><div class="table-wrap"><table><thead><tr><th>العملة</th><th>وارد الفترة</th><th>صادر الفترة</th><th>الرصيد الحالي</th><th>القيمة التقريبية</th></tr></thead><tbody>${byCurrency.map(x=>`<tr><td><b>${x.code}</b></td><td>${money(x.in,4)}</td><td>${money(x.out,4)}</td><td>${money(x.balance,4)}</td><td>${money(x.value)} ${state.settings.baseCurrency}</td></tr>`).join('') || emptyRow(5)}</tbody></table></div></div>
      </div>
      <div class="grid two" style="margin-bottom:16px">
        <div class="card"><div class="card-head"><h3>تقرير الحوالات</h3></div><div class="table-wrap"><table><thead><tr><th>التاريخ</th><th>الرقم</th><th>الحالة</th><th>الأسماء</th><th>المقبوض</th><th>التسليم</th><th>الربح</th></tr></thead><tbody>${transferRows}</tbody></table></div></div>
        <div class="card"><div class="card-head"><h3>تقرير الشيكات</h3></div><div class="table-wrap"><table><thead><tr><th>التاريخ</th><th>الرقم</th><th>النوع</th><th>الاسم</th><th>المبلغ</th><th>الحالة</th><th>الربح</th></tr></thead><tbody>${checkRows}</tbody></table></div></div>
      </div>
      <div class="grid two">
        <div class="card"><div class="card-head"><h3>تقرير صندوق الكاش</h3></div><div class="table-wrap"><table><thead><tr><th>التاريخ</th><th>النوع</th><th>المبلغ</th><th>الرصيد</th><th>البيان</th><th>المرجع</th><th>الموظف</th></tr></thead><tbody>${ledgerRows}</tbody></table></div></div>
        <div class="card"><div class="card-head"><h3>سجل التعديلات والتدقيق</h3></div><div class="table-wrap"><table><thead><tr><th>التاريخ</th><th>الموظف</th><th>الحدث</th><th>التفاصيل</th></tr></thead><tbody>${auditRows}</tbody></table></div></div>
      </div>
    `);
    function setReportRange(nextMode){
      const now = new Date(); const y = now.getFullYear(); const m = String(now.getMonth()+1).padStart(2,'0');
      let a = today(), b = today();
      if(nextMode === 'monthly') a = `${y}-${m}-01`;
      if(nextMode === 'yearly') a = `${y}-01-01`;
      if(nextMode === 'custom'){ a = $('#rStart').value || a; b = $('#rEnd').value || b; }
      localStorage.setItem('reportMode', nextMode); localStorage.setItem('reportStart', a); localStorage.setItem('reportEnd', b); renderReports();
    }
    $$('[data-report-mode]').forEach(btn => btn.onclick = () => setReportRange(btn.dataset.reportMode));
    $('#applyReport').onclick = () => { localStorage.setItem('reportMode','custom'); localStorage.setItem('reportStart',$('#rStart').value); localStorage.setItem('reportEnd',$('#rEnd').value); renderReports(); };
    $('#exportReport').onclick = () => exportCSV('report.csv', [...ops.map(x=>({recordType:'exchange',...x})),...transfers.map(x=>({recordType:'transfer',...x})),...checks.map(x=>({recordType:'check',...x})), ...ledger.map(x=>({recordType:'ledger',...x}))]);
  }

          <textarea class="mono" id="backupText" style="width:100%;height:220px;margin-top:14px;border-radius:18px;border:1px solid #dfe6f1;padding:12px" readonly>${esc(JSON.stringify(state,null,2))}</textarea>
        </div>

          <div class="danger-zone" style="margin-top:16px"><h4 style="margin-top:0;color:#b51e1e">منطقة خطرة</h4><button class="btn red" id="factoryReset">مسح كل البيانات وإرجاع النظام الافتراضي</button></div>

  function renderSearch(){

  function bindReceiptButtons(){
    $$('[data-receipt]').forEach(btn => btn.onclick = () => { const [type,id] = btn.dataset.receipt.split(':'); openReceipt(type,id); });
  }
  function openReceipt(type, id){
    activeReceipt = {type,id};
    const record = type === 'operation' ? state.operations.find(x=>x.id===id) : type === 'transfer' ? state.transfers.find(x=>x.id===id) : state.checks.find(x=>x.id===id);
    if(!record) return toast('لم يتم العثور على السجل', 'error');
    const title = type === 'operation' ? 'إيصال صرافة' : type === 'transfer' ? 'إيصال حوالة' : 'إيصال شيك';
    const lines = receiptLines(type, record);
    $('#receiptContent').innerHTML = `<div class="receipt" id="receiptPaper"><div class="receipt-brand"><div class="brand" style="color:#07182f">${brandLogo(68)}<div><h2>${esc(state.settings.companyName)}</h2><p>${esc(state.settings.slogan)}</p><p>${esc(state.settings.phone)} — ${esc(state.settings.address)}</p></div></div><div style="text-align:left;direction:ltr;font-weight:900;color:#07182f">${esc(record.id)}<br><span style="font-size:12px;color:#6d7890">${dt(record.createdAt)}</span></div></div><h3 style="margin:0 0 14px;font-weight:900;color:#07182f">${title}</h3><div class="receipt-table">${lines.map(([k,v])=>`<div class="receipt-line"><span>${esc(k)}</span><strong>${esc(v)}</strong></div>`).join('')}</div><div style="border-top:2px dashed #d8dfeb;margin-top:18px;padding-top:12px;text-align:center;color:#6d7890;font-weight:800">هذا الإيصال مرجع رسمي للعملية حسب سجلات ${esc(state.settings.companyName)}.</div></div>`;
    $('#receiptModal').classList.add('show');
  }
  function receiptLines(type, r){
    if(type === 'operation') return [['نوع العملية',r.type],['العميل',r.customerName],['الهاتف',r.phone || '-'],['المبلغ',`${money(r.amount,4)} ${r.currency}`],['مبلغ التسوية',`${money(r.settlementAmount,4)} ${r.settlementCurrency}`],['سعر الصرف',String(r.rate)],['العمولة',`${money(r.commission,4)} ${r.settlementCurrency}`],['الربح التقديري',`${money(r.profitBase)} ${state.settings.baseCurrency}`],['الموظف',r.employee],['الحالة',r.status],['ملاحظات',r.notes || '-']];
    if(type === 'transfer') return [['المرسل',r.senderName],['هاتف المرسل',r.senderPhone || '-'],['المستلم',r.receiverName],['هاتف المستلم',r.receiverPhone || '-'],['دولة الإرسال',r.countryFrom],['دولة الاستلام',r.countryTo],['المبلغ المرسل',`${money(r.amountSent,4)} ${r.sendCurrency}`],['المبلغ المستلم',`${money(r.amountReceive,4)} ${r.receiveCurrency}`],['العمولة',`${money(r.commission,4)} ${r.commissionCurrency}`],['الحالة',r.status],['الموظف',r.employee],['ملاحظات',r.notes || '-']];
    if(type === 'check') return [['نوع الشيك',r.direction || '-'],['رقم الشيك',r.checkNo],['المستفيد / صاحب الشيك',r.beneficiary],['المبلغ',`${money(r.amount,4)} ${r.currency}`],['البنك/الجهة',r.bank],['تاريخ الإصدار',r.issueDate],['تاريخ الاستحقاق',r.dueDate],['سبب/بيان الشيك',r.reason],['العمولة',`${money(r.commission,4)} ${r.currency}`],['الحالة',r.status],['الموظف',r.employee],['ملاحظات',r.notes || '-']];
    return [['الرقم',r.id || '-'],['الحالة',r.status || '-']];
  }
  $('#closeReceipt').onclick = () => $('#receiptModal').classList.remove('show');
  $('#downloadReceipt').onclick = () => {
    if(!activeReceipt) return;
    const record = activeReceipt.type === 'operation' ? state.operations.find(x=>x.id===activeReceipt.id) : activeReceipt.type === 'transfer' ? state.transfers.find(x=>x.id===activeReceipt.id) : state.checks.find(x=>x.id===activeReceipt.id);
    drawReceiptImage(activeReceipt.type, record);

  function ensureUSDTSupport(){

      state.currencies.push({code:'USDT', name:'تيثر USDT', flag:'₮', rate:Number(usd?.rate || 365), worldRate:Number(usd?.worldRate || usd?.rate || 365), primary:true});
    }
    state.accounts = Array.isArray(state.accounts) ? state.accounts : [];
    state.accounts.forEach(acc => {
      acc.balances = {...(acc.balances || {})};
      if(acc.balances.USDT == null) acc.balances.USDT = 0;
      acc.rates = {...(acc.rates || {})};
      acc.allowedCurrencies = Array.isArray(acc.allowedCurrencies) ? acc.allowedCurrencies : [];

  function normalizeReceiptState(){
    state.settings = {...state.settings, receiptLanguage: state.settings.receiptLanguage || 'ar'};
    state.counters = {...state.counters, receipt: state.counters.receipt || 0, reference: state.counters.reference || 0};
    (state.currencies || []).forEach(c => { if(c.worldRate == null) c.worldRate = c.rate; });
    let receiptSeq = state.counters.receipt || 0;
    [...state.operations, ...state.transfers, ...state.checks].sort((a,b)=>new Date(a.createdAt||0)-new Date(b.createdAt||0)).forEach(rec => {
      if(!rec.receiptNo){ receiptSeq += 1; rec.receiptNo = `${new Date(rec.createdAt || Date.now()).getFullYear()}-${String(receiptSeq).padStart(6,'0')}`; }
    });
    state.counters.receipt = Math.max(state.counters.receipt || 0, receiptSeq);
    let refSeq = state.counters.reference || 0;
    [...state.transfers].sort((a,b)=>new Date(a.createdAt||0)-new Date(b.createdAt||0)).forEach(rec => {
      if(!rec.referenceNo){ refSeq += 1; rec.referenceNo = `TR-${new Date(rec.createdAt || Date.now()).getFullYear()}-${String(refSeq).padStart(6,'0')}`; }
    });
    state.counters.reference = Math.max(state.counters.reference || 0, refSeq);
    save();

  async function updateGlobalRates(codes = state.currencies.map(c=>c.code), silent = false){
    const base = state.settings.baseCurrency || 'ILS';
    try{
      if(!silent) toast('جاري جلب الأسعار العالمية للاطلاع...');
      const res = await fetch(`https://open.er-api.com/v6/latest/${encodeURIComponent(base)}`);
      if(!res.ok) throw new Error('تعذر الاتصال بمصدر الأسعار');
      const data = await res.json();
      const rates = data.rates || data.conversion_rates || {};
      let count = 0;
      state.currencies.forEach(c => {
        if(!codes.includes(c.code)) return;
        if(c.code === base){ c.worldRate = 100; count++; return; }
        const apiCode = c.code === 'USDT' && !rates.USDT ? 'USD' : c.code;
        const v = Number(rates[apiCode]);
        if(v > 0){ c.worldRate = round(100 / v, 4); count++; }
      });
      state.settings.lastGlobalRatesAt = nowISO();
      audit('جلب أسعار عالمية للاطلاع', `تحديث ${count} عملة من ${base}`);
      save();
      if(!silent) toast(`تم تحديث الأسعار العالمية لـ ${count} عملة، دون تغيير الأسعار المحلية المعتمدة`);
      return count;
    }catch(err){ if(!silent) toast('فشل جلب الأسعار العالمية: ' + err.message, 'error'); return 0; }
  }

        const movements = []; let status = 'قيد الاستلام';
        if(d.direction === 'صادر'){ movements.push({accountId:d.accountId, code:d.currency, delta:-amount, reason:'إصدار شيك صادر وخصم المبلغ من الحساب'}); if(commission) movements.push({accountId:d.accountId, code:d.currency, delta:commission, reason:'عمولة شيك صادر'}); status = 'مصروف'; }
        else{ if(commission) movements.push({accountId:d.accountId, code:d.currency, delta:commission, reason:'عمولة شيك وارد'}); status = 'قيد الاستلام'; }
        const applied = applyMovements(movements, {ref:id, reason:'شيك مالي', note:d.notes});
        const ch = {id, receiptNo, referenceNo:id, createdAt:nowISO(), accountId:d.accountId, accountName:accountName(d.accountId), direction:d.direction, checkNo:d.checkNo, beneficiary:d.beneficiary, amount, currency:d.currency, issueDate:d.issueDate, dueDate:d.dueDate, bank:d.bank, reason:d.reason, commission, status, received:d.direction==='صادر', receivedAt:d.direction==='صادر'?nowISO():'', employee:currentEmployee().name, notes:d.notes, profitBase:toBase(commission,d.currency), movements:movements.map(m=>({...m})), ledgerIds:applied.map(x=>x.id)};
        state.checks.unshift(ch); ensureCustomer(d.beneficiary,''); audit(d.direction === 'صادر' ? 'إصدار شيك صادر' : 'تسجيل شيك وارد', receiptNo); save(); toast(d.direction === 'صادر' ? 'تم إصدار الشيك وخصم المبلغ من الصندوق' : 'تم تسجيل الشيك الوارد بانتظار الاستلام'); renderChecks(); openReceipt('check', id);
      }catch(err){ if(!handleBalanceError(err)) toast(err.message, 'error'); }
    };
    $$('[data-receive-check]').forEach(b => b.onclick = () => receiveCheck(b.dataset.receiveCheck));
    $$('[data-cancel-check]').forEach(b => b.onclick = () => reverseRecord(state.checks.find(x=>x.id===b.dataset.cancelCheck), 'شيك'));
    $('#exportChecks').onclick = () => exportCSV('checks.csv', state.checks);
    bindReceiptButtons();
  }
  function renderSearch(){
    const q = ($('#globalSearch').value || '').trim().toLowerCase();
    const source = [
      ...state.operations.map(x=>({kind:'عملية صرافة', id:x.id, receiptNo:displayReceiptNo(x), ref:displayReferenceNo(x), name:x.customerName, phone:x.phone || '', date:x.createdAt, text:[JSON.stringify(x),x.receiptNo,x.referenceNo].join(' '), receipt:`operation:${x.id}`})),
      ...state.transfers.map(x=>({kind:'حوالة', id:x.id, receiptNo:displayReceiptNo(x), ref:displayReferenceNo(x), name:`${x.senderName || '-'} / ${x.receiverName}`, phone:`${x.senderPhone || ''} ${x.receiverPhone || ''}`, date:x.createdAt, text:[JSON.stringify(x),x.receiptNo,x.referenceNo].join(' '), receipt:`transfer:${x.id}`})),
      ...state.checks.map(x=>({kind:'شيك', id:x.id, receiptNo:displayReceiptNo(x), ref:displayReferenceNo(x), name:x.beneficiary, phone:'', date:x.createdAt, text:[JSON.stringify(x),x.receiptNo,x.referenceNo].join(' '), receipt:`check:${x.id}`})),
      ...state.customers.map(x=>({kind:'عميل', id:x.id, receiptNo:'-', ref:'-', name:x.name, phone:x.phone || '', date:x.createdAt, text:JSON.stringify(x)}))
    ];
    const rows = source.filter(x => x.text.toLowerCase().includes(q)).slice(0,120).map(x=>`<tr><td>${esc(x.kind)}</td><td><b>${esc(x.receiptNo)}</b></td><td>${esc(x.ref)}</td><td>${esc(x.name)}</td><td>${esc(x.phone)}</td><td>${x.date ? dt(x.date):''}</td><td>${x.receipt?`<button class="btn ghost sm" data-receipt="${x.receipt}">إيصال</button>`:''}</td></tr>`).join('') || emptyRow(7, 'لا توجد نتائج مطابقة');
    mount(`<div class="card"><div class="card-head"><h3>نتائج البحث: ${esc(q)}</h3><small>يمكن البحث برقم الوصل أو الرقم المرجعي أو اسم العميل أو الهاتف أو التاريخ</small></div><div class="table-wrap"><table><thead><tr><th>النوع</th><th>رقم الوصل</th><th>الرقم المرجعي</th><th>الاسم</th><th>الهاتف</th><th>التاريخ</th><th>الإيصال</th></tr></thead><tbody>${rows}</tbody></table></div></div>`); bindReceiptButtons();
  }
  function renderReports(){
    const mode = localStorage.getItem('reportMode') || 'daily';
    const reportDate = localStorage.getItem('reportDate') || today();
    const statementDate = localStorage.getItem('statementDate') || today();
    const statementAccount = localStorage.getItem('statementAccount') || 'all';
    let start = reportDate, end = reportDate;
    if(mode === 'monthly'){ const d = new Date(reportDate+'T00:00:00'); start = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-01`; end = new Date(d.getFullYear(), d.getMonth()+1, 0).toISOString().slice(0,10); }
    const from = new Date(start + 'T00:00:00'); const to = new Date(end + 'T23:59:59');
    const inRange = x => { const raw = x.createdAt || x.at || x.receivedAt || x.cashedAt; const dd = new Date(raw); return dd >= from && dd <= to; };
    const ops = state.operations.filter(inRange), transfers = state.transfers.filter(inRange), checks = state.checks.filter(inRange), ledger = state.ledger.filter(inRange);
    const incoming = ledger.filter(x=>x.delta>0).reduce((sum,x)=>sum+toBase(x.delta,x.code,x.accountId),0);
    const outgoing = ledger.filter(x=>x.delta<0).reduce((sum,x)=>sum+toBase(Math.abs(x.delta),x.code,x.accountId),0);
    const profit = [...ops,...transfers,...checks].filter(recordStatusOk).reduce((sum,x)=>sum+Number(x.profitBase||0),0);
    const summaryRows = [...ops.map(x=>({type:'صرافة',receiptNo:displayReceiptNo(x), ref:displayReferenceNo(x), account:x.accountName, person:x.customerName, amount:`${money(x.amount,4)} ${x.currency}`, commission:`${money(x.commission,4)} ${x.settlementCurrency}`, profit:money(x.profitBase), at:dt(x.createdAt)})), ...transfers.map(x=>({type:'حوالة',receiptNo:displayReceiptNo(x), ref:displayReferenceNo(x), account:x.accountName, person:`${x.senderName || '-'} → ${x.receiverName}`, amount:`${money(x.amountSent,4)} ${x.sendCurrency}`, commission:`${money(x.commission,4)} ${x.commissionCurrency}`, profit:money(x.profitBase), at:dt(x.createdAt)})), ...checks.map(x=>({type:'شيك',receiptNo:displayReceiptNo(x), ref:displayReferenceNo(x), account:x.accountName, person:x.beneficiary, amount:`${money(x.amount,4)} ${x.currency}`, commission:`${money(x.commission,4)} ${x.currency}`, profit:money(x.profitBase), at:dt(x.createdAt)}))].slice(0,200);
    const stStart = new Date(statementDate+'T00:00:00'); const stEnd = new Date(statementDate+'T23:59:59');
    const ledAll = state.ledger.filter(x => statementAccount==='all' || x.accountId===statementAccount);
    const openingByCode = {}; state.currencies.forEach(c => openingByCode[c.code] = 0);
    ledAll.filter(x=>new Date(x.at)<stStart).forEach(x => openingByCode[x.code] = round((openingByCode[x.code] || 0) + Number(x.delta),4));
    const statementRows = ledAll.filter(x=>new Date(x.at)>=stStart && new Date(x.at)<=stEnd);
    const openingBase = Object.entries(openingByCode).reduce((s,[code,val]) => s + toBase(val, code, statementAccount==='all'?'':statementAccount), 0);
    const statementIncoming = statementRows.filter(x=>x.delta>0).reduce((s,x)=>s+toBase(x.delta,x.code,x.accountId),0);
    const statementOutgoing = statementRows.filter(x=>x.delta<0).reduce((s,x)=>s+toBase(Math.abs(x.delta),x.code,x.accountId),0);
    const statementProfit = [...state.operations,...state.transfers,...state.checks].filter(x=>dateOnly(x.createdAt || x.at)===statementDate && (statementAccount==='all' || x.accountId===statementAccount) && recordStatusOk(x)).reduce((s,x)=>s+Number(x.profitBase||0),0);
    const closingBase = round(openingBase + statementIncoming - statementOutgoing, 4);
    mount(`
      <div class="toolbar">
        <div class="filters">
          <button class="tab ${mode==='daily'?'active':''}" data-report-mode="daily">تقرير يومي</button>
          <button class="tab ${mode==='monthly'?'active':''}" data-report-mode="monthly">تقرير شهري</button>
          <input type="date" class="mini-input" id="reportDate" value="${reportDate}">
          <button class="btn primary sm" id="applyReport">تطبيق</button>
        </div>
        <button class="btn gray sm" id="exportReport">تصدير التقرير CSV</button>
      </div>
      <div class="grid cards" style="margin-bottom:16px">
        ${statCard('exchange','blue','عدد العمليات',ops.length + transfers.length + checks.length, `${mode==='daily'?'في اليوم':'في الشهر'} المحدد`)}
        ${statCard('in','green','الوارد',`${money(incoming)} ${state.settings.baseCurrency}`,'ضمن الفترة المحددة')}
        ${statCard('out','red','الصادر',`${money(outgoing)} ${state.settings.baseCurrency}`,'ضمن الفترة المحددة')}
        ${statCard('profit','orange','صافي الأرباح',`${money(profit)} ${state.settings.baseCurrency}`,'عمولات وأرباح الصرافة والحوالات والشيكات')}
      </div>
      <div class="card" style="margin-bottom:16px"><div class="card-head"><h3>${mode==='daily'?'التقرير اليومي':'التقرير الشهري'}</h3><small>${start} ← ${end}</small></div><div class="table-wrap"><table><thead><tr><th>النوع</th><th>رقم الوصل</th><th>الرقم المرجعي</th><th>الحساب</th><th>الاسم</th><th>المبلغ</th><th>العمولة</th><th>الربح</th><th>التاريخ</th></tr></thead><tbody>${summaryRows.map(r=>`<tr><td>${r.type}</td><td><b>${r.receiptNo}</b></td><td>${r.ref}</td><td>${esc(r.account || '-')}</td><td>${esc(r.person || '-')}</td><td>${r.amount}</td><td>${r.commission}</td><td>${r.profit} ${state.settings.baseCurrency}</td><td>${r.at}</td></tr>`).join('') || emptyRow(9)}</tbody></table></div></div>
      <div class="report-statement-box">
        <div class="card-head" style="padding:0 0 14px;border:0;background:transparent"><h3>كشف حساب ليوم واحد</h3><small>اختر تاريخًا واحدًا فقط وسيظهر الرصيد الافتتاحي والحركات والعمولات والرصيد الختامي</small></div>
        <div class="toolbar" style="padding:0;background:transparent;border:0;box-shadow:none">
          <div class="filters">
            <input type="date" class="mini-input" id="statementDate" value="${statementDate}">
            <select class="mini-input" id="statementAccount"><option value="all" ${statementAccount==='all'?'selected':''}>كل الحسابات</option>${getAccounts(false).map(a=>`<option value="${a.id}" ${statementAccount===a.id?'selected':''}>${esc(a.name)}</option>`).join('')}</select>
            <button class="btn primary sm" id="applyStatement">إظهار الكشف</button>
          </div>
        </div>
        <div class="summary-pills">
          <div class="summary-pill"><b>الرصيد الافتتاحي</b><strong>${money(openingBase)} ${state.settings.baseCurrency}</strong></div>
          <div class="summary-pill"><b>الواردات</b><strong>${money(statementIncoming)} ${state.settings.baseCurrency}</strong></div>
          <div class="summary-pill"><b>الصادرات</b><strong>${money(statementOutgoing)} ${state.settings.baseCurrency}</strong></div>
          <div class="summary-pill"><b>العمولات/الأرباح</b><strong>${money(statementProfit)} ${state.settings.baseCurrency}</strong></div>
          <div class="summary-pill"><b>الرصيد الختامي</b><strong>${money(closingBase)} ${state.settings.baseCurrency}</strong></div>
        </div>
        <div class="table-wrap" style="margin-top:14px"><table><thead><tr><th>التاريخ</th><th>الحساب</th><th>النوع</th><th>المبلغ</th><th>المرجع</th><th>البيان</th><th>الموظف</th></tr></thead><tbody>${statementRows.map(x=>`<tr><td>${dt(x.at)}</td><td>${esc(x.accountName || accountName(x.accountId))}</td><td>${statusBadge(x.type)}</td><td>${money(Math.abs(x.delta),4)} ${x.code}</td><td>${esc(x.ref || '-')}</td><td>${esc(x.reason || '-')}</td><td>${esc(x.employee || '-')}</td></tr>`).join('') || emptyRow(7)}</tbody></table></div>
      </div>`);
    $$('[data-report-mode]').forEach(btn => btn.onclick = () => { localStorage.setItem('reportMode', btn.dataset.reportMode); renderReports(); });
    $('#applyReport').onclick = () => { localStorage.setItem('reportDate', $('#reportDate').value || today()); renderReports(); };
    $('#applyStatement').onclick = () => { localStorage.setItem('statementDate', $('#statementDate').value || today()); localStorage.setItem('statementAccount', $('#statementAccount').value || 'all'); renderReports(); };
    $('#exportReport').onclick = () => exportCSV('office-report.csv', summaryRows);
  }
  function renderSettings(){
    const s = state.settings;
    mount(`
      <div class="grid two">
        <div class="card pad">
          <div class="card-head" style="padding:0 0 14px;border:0;background:transparent"><h3>معلومات الصرافة</h3><small>تظهر في الواجهة والإيصالات</small></div>
          <form id="settingsForm" class="form-grid">
            <div class="field"><label>اسم الصرافة</label><input name="companyName" value="${esc(s.companyName)}" required></div>
            <div class="field"><label>رقم الهاتف</label><input name="phone" value="${esc(s.phone)}"></div>
            <div class="field"><label>العنوان</label><input name="address" value="${esc(s.address)}"></div>
            <div class="field"><label>الشعار النصي</label><input name="logoText" value="${esc(s.logoText)}" maxlength="6"></div>
            <div class="field full"><label>وصف قصير</label><input name="slogan" value="${esc(s.slogan)}"></div>
            <div class="field"><label>العملة الأساسية للتقارير</label><select name="baseCurrency">${currencyOptions(s.baseCurrency)}</select></div>
            <div class="field"><label>المستخدم الحالي</label><select name="currentUser">${state.employees.map(e=>`<option ${s.currentUser===e.name?'selected':''}>${esc(e.name)}</option>`).join('')}</select></div>
            <div class="field"><label>لغة الإيصال</label><select name="receiptLanguage"><option value="ar" ${s.receiptLanguage==='ar'?'selected':''}>العربية</option><option value="en" ${s.receiptLanguage==='en'?'selected':''}>English</option><option value="bi" ${s.receiptLanguage==='bi'?'selected':''}>عربي + English</option></select></div>
            <div class="field"><label>تنسيق رقم الوصل</label><input value="${new Date().getFullYear()}-000001" disabled></div>
            <div class="field full"><label>رفع شعار صورة</label><input type="file" id="logoUpload" accept="image/*"><div class="hint">اختياري. يتم تخزين الشعار داخل المتصفح، ويفضل صورة صغيرة.</div></div>
            <div class="field"><button type="button" class="btn gray block" id="clearLogo">إزالة شعار الصورة</button></div>
            <div class="field"><button class="btn green block">حفظ الإعدادات</button></div>
          </form>
        </div>
        <div class="card pad">
          <h3 style="margin-top:0;font-weight:900">معاينة الهوية والإيصالات</h3>
          <div class="hero" style="box-shadow:none"><div class="brand" style="color:#061a35">${brandLogo(72)}<div><h1 style="margin:0;font-size:28px">${esc(s.companyName)}</h1><p style="margin:5px 0 0;color:#263750;font-weight:800">${esc(s.slogan)}</p><p style="margin:5px 0 0;color:#263750;font-weight:800">${esc(s.phone)} — ${esc(s.address)}</p><p style="margin:9px 0 0;color:#6d7890;font-weight:900">آخر رقم وصل مسجل: ${String(state.counters.receipt || 0).padStart(6,'0')}</p></div></div></div>
        </div>
      </div>`);
    $('#settingsForm').onsubmit = e => { e.preventDefault(); const d=Object.fromEntries(new FormData(e.target)); state.settings = {...state.settings, ...d}; audit('تعديل الإعدادات','بيانات الصرافة'); save(); toast('تم حفظ الإعدادات'); renderSettings(); };
    $('#logoUpload').onchange = e => { const file=e.target.files[0]; if(!file) return; const r=new FileReader(); r.onload=()=>{ state.settings.logoData = r.result; save(); toast('تم رفع الشعار'); renderSettings(); }; r.readAsDataURL(file); };
    $('#clearLogo').onclick = () => { state.settings.logoData=''; save(); toast('تم إزالة شعار الصورة'); renderSettings(); };
  }
  const receiptActions = document.querySelector('#receiptModal .modal-head > div');
  if(receiptActions){
    receiptActions.innerHTML = `
      <select id="receiptLangSelect" class="mini-input" style="min-width:140px"><option value="ar">العربية</option><option value="en">English</option><option value="bi">عربي + English</option></select>
      <button class="btn gray sm" id="downloadReceipt">تنزيل صورة</button>
      <button class="btn primary sm" id="printReceipt" type="button">طباعة</button>
      <button class="btn red sm" id="closeReceipt">إغلاق</button>`;
  }
  $('#closeReceipt').onclick = () => $('#receiptModal').classList.remove('show');
  $('#downloadReceipt').onclick = () => { downloadReceiptAsImage(); };
  $('#printReceipt').onclick = () => { printReceiptCurrent(); };
  $('#receiptLangSelect').onchange = e => { state.settings.receiptLanguage = e.target.value; save(); if(activeReceipt) openReceipt(activeReceipt.type, activeReceipt.id); };

  renderStaticIcons();
  applyTheme();
  if(!localStorage.getItem(KEY)) save();
  render();
})();
</script>
</body>
</html>
